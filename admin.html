<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FEF9F2">
<title>Admin · Party Fotos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* ── Login ─────────────────────────────────────────────────── */
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
    padding: 32px 28px calc(var(--safe-bot) + 32px);
    text-align: center;
    position: relative;
    z-index: 1;
  }
  #login-screen .lock-icon {
    font-size: 64px;
    line-height: 1;
    filter: drop-shadow(0 8px 18px rgba(201,125,10,0.25));
    animation: bob 4s ease-in-out infinite;
    margin-bottom: 20px;
  }
  #login-screen h1 {
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(34px, 10vw, 46px);
    letter-spacing: -0.028em;
    line-height: 1;
    margin: 0 0 8px;
    background: linear-gradient(170deg, #D78410 0%, #C97D0A 50%, #B0570E 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #login-screen .sub {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 32px;
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border-radius: 22px;
    padding: 28px 24px;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--line);
  }
  .field-wrap {
    position: relative;
    margin-bottom: 16px;
  }
  .field-wrap label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .field-wrap input {
    width: 100%;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: var(--bg-1);
    font-family: var(--body);
    font-size: 16px;
    color: var(--ink);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field-wrap input:focus {
    border-color: var(--amber);
    box-shadow: 0 0 0 3px rgba(201,125,10,0.12);
  }
  .login-error {
    font-size: 13px;
    color: #C0392B;
    font-weight: 500;
    min-height: 18px;
    margin-bottom: 14px;
    text-align: center;
  }

  /* ── Dashboard ─────────────────────────────────────────────── */
  #dashboard { display: none; }
  #dashboard.visible { display: block; }

  .admin-header {
    padding: calc(var(--safe-top) + 18px) 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  .admin-header h2 {
    font-family: var(--display);
    font-weight: 900;
    font-size: 26px;
    letter-spacing: -0.025em;
    margin: 0;
    background: linear-gradient(170deg, #D78410, #B0570E);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .admin-header .badge {
    font-size: 11px;
    font-weight: 700;
    color: var(--amber);
    background: rgba(201,125,10,0.1);
    padding: 3px 10px;
    border-radius: 999px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* Tab-Navigation */
  .tab-bar {
    display: flex;
    gap: 0;
    padding: 14px 20px 0;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
    border-bottom: 1.5px solid var(--line);
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    padding: 10px 4px 12px;
    font-family: var(--body);
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-mute);
    cursor: pointer;
    position: relative;
    transition: color .15s ease;
  }
  .tab-btn.active { color: var(--amber); }
  .tab-btn.active::after {
    content: "";
    position: absolute;
    bottom: -1.5px; left: 12%; right: 12%;
    height: 2.5px;
    border-radius: 2px;
    background: linear-gradient(90deg, #E89A2B, #D45A1E);
  }

  /* Tab-Inhalte */
  .tab-panel {
    display: none;
    padding: 20px 20px calc(var(--safe-bot) + 24px);
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  .tab-panel.active { display: block; }

  /* ── Settings-Tab ──────────────────────────────────────── */
  .settings-section {
    background: var(--card);
    border-radius: 18px;
    padding: 20px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--line);
    margin-bottom: 16px;
  }
  .settings-section h3 {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0 0 14px;
  }
  .setting-row {
    margin-bottom: 14px;
  }
  .setting-row:last-child { margin-bottom: 0; }
  .setting-row label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .setting-row input[type=text] {
    width: 100%;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: var(--bg-1);
    font-family: var(--body);
    font-size: 15px;
    color: var(--ink);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .setting-row input[type=text]:focus {
    border-color: var(--amber);
    box-shadow: 0 0 0 3px rgba(201,125,10,0.12);
  }
  .setting-hint {
    font-size: 12px;
    color: var(--ink-mute);
    margin-top: 5px;
  }
  .save-feedback {
    font-size: 13px;
    min-height: 18px;
    font-weight: 500;
    margin-top: 12px;
    text-align: center;
    transition: opacity .3s ease;
  }
  .save-feedback.ok   { color: #2E7D32; }
  .save-feedback.err  { color: #C0392B; }

  /* ── Photos-Tab ──────────────────────────────────────────── */
  .admin-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .admin-tile {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    overflow: hidden;
    background: var(--card);
    box-shadow: var(--shadow-sm);
  }
  .admin-tile img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity .2s ease;
  }
  .admin-tile.hidden-tile img { opacity: 0.35; }
  .admin-tile .cat-badge {
    position: absolute;
    top: 7px; left: 7px;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .admin-tile .cat-badge.fotobox {
    background: rgba(201,125,10,0.85);
    color: #fff;
  }
  .admin-tile .cat-badge.guest {
    background: rgba(28,24,20,0.55);
    color: rgba(255,255,255,0.9);
  }
  .admin-tile .hidden-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    background: rgba(28,24,20,0.35);
    opacity: 0;
    transition: opacity .2s ease;
  }
  .admin-tile.hidden-tile .hidden-label { opacity: 1; }
  .admin-tile .tile-actions {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    display: flex;
    gap: 1px;
    background: rgba(28,24,20,0.55);
    backdrop-filter: blur(6px);
  }
  .admin-tile .tile-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: #fff;
    font-family: var(--body);
    font-size: 11px;
    font-weight: 600;
    padding: 7px 4px;
    cursor: pointer;
    transition: background .15s ease;
    line-height: 1;
    text-align: center;
  }
  .admin-tile .tile-btn:hover { background: rgba(255,255,255,0.12); }
  .admin-tile .tile-btn.del { color: #FF8A80; }

  /* ── Diashow-Tab ─────────────────────────────────────────── */
  .diashow-section {
    background: var(--card);
    border-radius: 18px;
    padding: 28px 20px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--line);
    text-align: center;
  }
  .diashow-section .big-icon {
    font-size: 64px;
    line-height: 1;
    display: inline-block;
    filter: drop-shadow(0 6px 14px rgba(201,125,10,0.2));
    margin-bottom: 16px;
  }
  .diashow-section h3 {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: 0 0 8px;
  }
  .diashow-section p {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 24px;
    line-height: 1.5;
  }
  .diashow-feedback {
    font-size: 13px;
    font-weight: 500;
    min-height: 18px;
    margin-top: 14px;
  }
  .diashow-feedback.ok  { color: #2E7D32; }
  .diashow-feedback.err { color: #C0392B; }

  /* Logout-Link */
  .logout-row {
    text-align: center;
    margin-top: 6px;
  }
  .logout-btn {
    background: none;
    border: none;
    font-family: var(--body);
    font-size: 13px;
    color: var(--ink-mute);
    cursor: pointer;
    text-decoration: underline;
    padding: 8px;
  }
</style>
</head>
<body>
  <div class="blobs" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <!-- ── Login ──────────────────────────────────────────────── -->
  <div id="login-screen">
    <div class="lock-icon" aria-hidden="true">🔐</div>
    <h1>Admin</h1>
    <p class="sub">Nur für Administratoren</p>
    <div class="login-card enter enter-1">
      <div class="field-wrap">
        <label for="pwInput">Passwort</label>
        <input id="pwInput" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <div class="login-error" id="loginError"></div>
      <button class="btn btn-amber" id="loginBtn" type="button">Anmelden</button>
    </div>
  </div>

  <!-- ── Dashboard ──────────────────────────────────────────── -->
  <div id="dashboard">
    <header class="admin-header">
      <h2>Admin</h2>
      <span class="badge">Intern</span>
    </header>

    <nav class="tab-bar" role="tablist">
      <button class="tab-btn active" role="tab" data-tab="settings">⚙️ Einstellungen</button>
      <button class="tab-btn"        role="tab" data-tab="photos">🖼️ Bilder</button>
      <button class="tab-btn"        role="tab" data-tab="diashow">🖥️ Diashow</button>
    </nav>

    <!-- Tab: Einstellungen -->
    <div class="tab-panel active" id="tab-settings" role="tabpanel">
      <div class="settings-section">
        <h3>Startseite</h3>
        <div class="setting-row">
          <label for="inputTitle">Seiten-Titel</label>
          <input type="text" id="inputTitle" maxlength="80" placeholder="Party Fotos">
        </div>
        <div class="setting-row">
          <label for="inputTagline">Untertitel</label>
          <input type="text" id="inputTagline" maxlength="120" placeholder="Teile deine schönsten Aufnahmen">
        </div>
      </div>

      <div class="settings-section">
        <h3>Download-Wasserzeichen</h3>
        <div class="setting-row">
          <label for="inputWatermark">Wasserzeichen-Text</label>
          <input type="text" id="inputWatermark" maxlength="100" placeholder="Party 2025">
          <div class="setting-hint">Erscheint nur in heruntergeladenen Bildern, unten mittig.</div>
        </div>
      </div>

      <button class="btn btn-amber" id="saveConfigBtn" type="button">Einstellungen speichern</button>
      <div class="save-feedback" id="saveFeedback"></div>
      <div class="logout-row">
        <button class="logout-btn" id="logoutBtn" type="button">Abmelden</button>
      </div>
    </div>

    <!-- Tab: Bilder -->
    <div class="tab-panel" id="tab-photos" role="tabpanel">
      <div class="admin-grid" id="adminGrid"></div>
      <div id="photosEmpty" style="display:none; text-align:center; padding:48px 0; color:var(--ink-mute); font-size:14px;">
        Noch keine Fotos hochgeladen.
      </div>
    </div>

    <!-- Tab: Diashow -->
    <div class="tab-panel" id="tab-diashow" role="tabpanel">
      <div class="diashow-section">
        <div class="big-icon" aria-hidden="true">🖥️</div>
        <h3>Diashow starten</h3>
        <p>Öffnet Chromium im Kiosk-Modus auf dem Raspberry Pi und zeigt alle Fotos.</p>
        <button class="btn btn-amber" id="startSlideshowBtn" type="button">
          Diashow starten 🎬
        </button>
        <div class="diashow-feedback" id="diashowFeedback"></div>
      </div>
    </div>
  </div>

<script>
(function(){
  // ── Elemente ────────────────────────────────────────────────
  const loginScreen = document.getElementById('login-screen');
  const dashboard   = document.getElementById('dashboard');
  const pwInput     = document.getElementById('pwInput');
  const loginBtn    = document.getElementById('loginBtn');
  const loginError  = document.getElementById('loginError');
  const logoutBtn   = document.getElementById('logoutBtn');

  const tabBtns     = document.querySelectorAll('.tab-btn');
  const tabPanels   = document.querySelectorAll('.tab-panel');

  const inputTitle     = document.getElementById('inputTitle');
  const inputTagline   = document.getElementById('inputTagline');
  const inputWatermark = document.getElementById('inputWatermark');
  const saveConfigBtn  = document.getElementById('saveConfigBtn');
  const saveFeedback   = document.getElementById('saveFeedback');

  const adminGrid   = document.getElementById('adminGrid');
  const photosEmpty = document.getElementById('photosEmpty');

  const startSlideshowBtn = document.getElementById('startSlideshowBtn');
  const diashowFeedback   = document.getElementById('diashowFeedback');

  // ── Session-Check ───────────────────────────────────────────
  async function checkSession(){
    try {
      const r = await fetch('admin.php?action=check');
      const d = await r.json();
      if (d.logged_in) showDashboard();
    } catch(e) {}
  }

  // ── Login ───────────────────────────────────────────────────
  async function doLogin(){
    loginError.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Prüfe…';
    const fd = new FormData();
    fd.append('password', pwInput.value);
    try {
      const r = await fetch('admin.php?action=login', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.ok) {
        showDashboard();
      } else {
        loginError.textContent = d.error || 'Falsches Passwort';
        pwInput.value = '';
        pwInput.focus();
      }
    } catch(e) {
      loginError.textContent = 'Verbindungsfehler';
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Anmelden';
    }
  }

  loginBtn.addEventListener('click', doLogin);
  pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  // ── Logout ──────────────────────────────────────────────────
  logoutBtn.addEventListener('click', async () => {
    await fetch('admin.php?action=logout', { method: 'POST' });
    dashboard.classList.remove('visible');
    loginScreen.style.display = '';
    pwInput.value = '';
  });

  // ── Dashboard zeigen ────────────────────────────────────────
  function showDashboard(){
    loginScreen.style.display = 'none';
    dashboard.classList.add('visible');
    loadConfig();
    loadPhotos();
  }

  // ── Tabs ────────────────────────────────────────────────────
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      tabPanels.forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ── Einstellungen laden ─────────────────────────────────────
  async function loadConfig(){
    try {
      const r = await fetch('admin.php?action=get_config');
      const d = await r.json();
      if (d.ok) {
        inputTitle.value     = d.title          || '';
        inputTagline.value   = d.tagline        || '';
        inputWatermark.value = d.watermark_text || '';
      }
    } catch(e) {}
  }

  // ── Einstellungen speichern ─────────────────────────────────
  saveConfigBtn.addEventListener('click', async () => {
    saveFeedback.textContent = '';
    saveFeedback.className = 'save-feedback';
    saveConfigBtn.disabled = true;
    const fd = new FormData();
    fd.append('title', inputTitle.value);
    fd.append('tagline', inputTagline.value);
    fd.append('watermark_text', inputWatermark.value);
    try {
      const r = await fetch('admin.php?action=save_config', { method: 'POST', body: fd });
      const d = await r.json();
      saveFeedback.classList.add(d.ok ? 'ok' : 'err');
      saveFeedback.textContent = d.ok ? '✓ Gespeichert!' : (d.error || 'Fehler beim Speichern');
    } catch(e) {
      saveFeedback.classList.add('err');
      saveFeedback.textContent = 'Verbindungsfehler';
    } finally {
      saveConfigBtn.disabled = false;
      setTimeout(() => { saveFeedback.textContent = ''; saveFeedback.className = 'save-feedback'; }, 3000);
    }
  });

  // ── Fotos laden (Admin) ─────────────────────────────────────
  async function loadPhotos(){
    adminGrid.innerHTML = '';
    try {
      const r = await fetch('admin.php?action=get_photos');
      const d = await r.json();
      if (!d.ok || !d.photos.length) {
        photosEmpty.style.display = '';
        return;
      }
      photosEmpty.style.display = 'none';
      d.photos.forEach(photo => renderAdminTile(photo));
    } catch(e) {
      adminGrid.innerHTML = '<p style="color:var(--ink-mute);font-size:14px;grid-column:1/-1;text-align:center;padding:32px">Ladefehler</p>';
    }
  }

  function renderAdminTile(photo){
    const tile = document.createElement('div');
    tile.className = 'admin-tile' + (photo.hidden ? ' hidden-tile' : '');
    tile.dataset.name = photo.name;

    const catLabel = photo.category === 'fotobox' ? 'Fotobox' : 'Gast';
    const catClass = photo.category === 'fotobox' ? 'fotobox' : 'guest';
    const hideLabel = photo.hidden ? 'Ausgeblendet' : 'Ausblenden';

    tile.innerHTML = `
      <img loading="lazy" src="thumbs/${encodeURIComponent(photo.name)}" alt="" onerror="this.onerror=null;this.src='uploads/${encodeURIComponent(photo.name)}';">
      <span class="cat-badge ${catClass}">${catLabel}</span>
      <div class="hidden-label">Ausgeblendet</div>
      <div class="tile-actions">
        <button class="tile-btn toggle-btn" data-hidden="${photo.hidden ? '1' : '0'}">${hideLabel}</button>
        <button class="tile-btn del del-btn">Löschen</button>
      </div>`;

    tile.querySelector('.toggle-btn').addEventListener('click', () => toggleHidden(photo.name, tile));
    tile.querySelector('.del-btn').addEventListener('click', () => deletePhoto(photo.name, tile));
    adminGrid.appendChild(tile);
  }

  async function toggleHidden(name, tile){
    const btn = tile.querySelector('.toggle-btn');
    const isHidden = btn.dataset.hidden === '1';
    const newHidden = !isHidden;
    btn.disabled = true;
    const fd = new FormData();
    fd.append('name', name);
    fd.append('hidden', newHidden ? '1' : '0');
    try {
      const r = await fetch('admin.php?action=set_hidden', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.ok) {
        btn.dataset.hidden = newHidden ? '1' : '0';
        btn.textContent = newHidden ? 'Einblenden' : 'Ausblenden';
        tile.classList.toggle('hidden-tile', newHidden);
      }
    } catch(e) {}
    btn.disabled = false;
  }

  async function deletePhoto(name, tile){
    if (!confirm(`"${name}" wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden.`)) return;
    const fd = new FormData();
    fd.append('name', name);
    try {
      const r = await fetch('admin.php?action=delete_photo', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.ok) {
        tile.style.transition = 'opacity .25s ease, transform .25s ease';
        tile.style.opacity = '0';
        tile.style.transform = 'scale(0.85)';
        setTimeout(() => tile.remove(), 250);
        if (!adminGrid.querySelector('.admin-tile')) photosEmpty.style.display = '';
      } else {
        alert(d.error || 'Fehler beim Löschen');
      }
    } catch(e) {
      alert('Verbindungsfehler');
    }
  }

  // ── Diashow starten ─────────────────────────────────────────
  startSlideshowBtn.addEventListener('click', async () => {
    diashowFeedback.textContent = '';
    diashowFeedback.className = 'diashow-feedback';
    startSlideshowBtn.disabled = true;
    startSlideshowBtn.textContent = 'Starte…';
    try {
      const r = await fetch('admin.php?action=start_slideshow', { method: 'POST' });
      const d = await r.json();
      diashowFeedback.classList.add(d.ok ? 'ok' : 'err');
      diashowFeedback.textContent = d.ok ? '✓ Diashow gestartet!' : (d.error || 'Fehler');
    } catch(e) {
      diashowFeedback.classList.add('err');
      diashowFeedback.textContent = 'Verbindungsfehler';
    } finally {
      startSlideshowBtn.disabled = false;
      startSlideshowBtn.textContent = 'Diashow starten 🎬';
    }
  });

  // ── Init ────────────────────────────────────────────────────
  checkSession();
})();
</script>
</body>
</html>
