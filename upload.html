<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FEF9F2">
<title>Foto hochladen · Party Fotos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .upload {
    padding: calc(var(--safe-top) + 24px) 22px 32px;
  }
  .upload .head {
    text-align: center;
    padding-top: 16px;
  }
  .upload .head .icon {
    font-size: 56px;
    line-height: 1;
    display: inline-block;
    filter: drop-shadow(0 8px 18px rgba(201,125,10,0.22));
    animation: floaty 5s ease-in-out infinite;
  }
  @keyframes floaty {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-5px) rotate(3deg); }
  }
  .upload h1 {
    font-family: var(--display);
    font-weight: 900;
    letter-spacing: -0.028em;
    line-height: 1.0;
    font-size: clamp(40px, 11vw, 50px);
    margin: 14px 0 10px;
    background: linear-gradient(170deg, #D78410 0%, #C97D0A 40%, #B0570E 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-wrap: balance;
  }
  .upload .sub {
    font-size: 15px;
    color: var(--ink-soft);
    margin: 0 auto;
    max-width: 32ch;
    line-height: 1.45;
    letter-spacing: -0.005em;
    text-wrap: balance;
  }

  /* Drop zone */
  .dropzone {
    margin-top: 28px;
    position: relative;
    background: var(--card);
    border-radius: 22px;
    padding: 36px 22px 30px;
    box-shadow: var(--shadow-md);
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    overflow: hidden;
    cursor: pointer;
  }
  .dropzone::before {
    content: "";
    position: absolute; inset: 6px;
    border-radius: 18px;
    border: 2px dashed rgba(201,125,10,0.38);
    pointer-events: none;
    transition: border-color .2s ease, background .2s ease;
  }
  .dropzone.drag::before {
    border-color: var(--amber);
    background: linear-gradient(180deg, rgba(232,154,43,0.06), rgba(212,90,30,0.06));
  }
  .dropzone .photo-icon {
    width: 64px; height: 64px;
    border-radius: 16px;
    background: linear-gradient(135deg, #FFF5DF, #FFE3BB);
    border: 1px solid rgba(201,125,10,0.18);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; line-height: 1;
    box-shadow: 0 6px 14px rgba(201,125,10,0.14);
    transition: transform .2s ease;
  }
  .dropzone.drag .photo-icon { transform: scale(1.1); }
  .dropzone .label {
    font-weight: 700;
    font-size: 19px;
    letter-spacing: -0.015em;
    color: var(--ink);
  }
  .dropzone .hint {
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
    letter-spacing: -0.005em;
  }
  .dropzone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }

  /* Selected list */
  .selected {
    margin-top: 14px;
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  .selected.show { display: flex; }
  .thumb-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    border-radius: 14px;
    padding: 10px 12px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--line);
  }
  .thumb-row .tt {
    width: 44px; height: 44px;
    border-radius: 10px;
    background: linear-gradient(135deg, #FFE3BB, #FFB279);
    flex: 0 0 44px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    overflow: hidden;
  }
  .thumb-row .tt img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 10px;
  }
  .thumb-row .meta { flex: 1; min-width: 0; }
  .thumb-row .name {
    font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .thumb-row .size { font-size: 12px; color: var(--ink-mute); }
  .thumb-row .rm {
    border: 0; background: transparent; color: var(--ink-mute);
    font-size: 18px; cursor: pointer; padding: 6px 8px; line-height: 1;
  }

  .cta-wrap { margin-top: 22px; }
  .help {
    text-align: center;
    font-size: 12px;
    color: var(--ink-mute);
    margin-top: 14px;
    letter-spacing: -0.005em;
    min-height: 18px;
  }
  .help b { color: var(--amber); font-weight: 600; }

  /* Progress bar */
  .progress-bar {
    height: 4px;
    background: rgba(28,24,20,0.08);
    border-radius: 99px;
    overflow: hidden;
    margin-top: 14px;
    display: none;
  }
  .progress-bar.show { display: block; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #E89A2B, #D45A1E);
    border-radius: 99px;
    width: 0%;
    transition: width 0.3s ease;
  }
</style>
</head>
<body>
  <div class="blobs" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <main class="app upload has-nav" data-screen-label="Upload">
    <section class="head enter enter-1">
      <div class="icon" aria-hidden="true">📸</div>
      <h1>Dein Foto<br>auf die Party!</h1>
      <p class="sub">Lade deine Bilder hoch — sie erscheinen live in der Diashow.</p>
    </section>

    <div class="dropzone enter enter-2" id="dropzone">
      <div class="photo-icon" aria-hidden="true">🖼️</div>
      <div class="label">Fotos auswählen</div>
      <div class="hint">oder hier reinziehen · JPG, PNG, HEIC</div>
      <input id="fileInput" type="file" accept="image/*" multiple>
    </div>

    <div class="selected enter" id="selected" aria-live="polite"></div>

    <div class="cta-wrap enter enter-3">
      <button class="btn btn-amber" id="uploadBtn" disabled>
        <span id="uploadLabel">Hochladen</span>
      </button>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="help" id="help">Wähle Fotos, um den Upload zu starten.</div>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Hauptnavigation">
    <div class="bottom-nav-inner">
      <a class="nav-item" href="index.html"><span class="ico" aria-hidden="true">🏠</span><span>Start</span></a>
      <a class="nav-item active" href="upload.html" aria-current="page"><span class="ico" aria-hidden="true">📸</span><span>Hochladen</span></a>
      <a class="nav-item" href="gallery.html"><span class="ico" aria-hidden="true">🖼️</span><span>Galerie</span></a>
    </div>
  </nav>

<script>
(function(){
  const dz      = document.getElementById('dropzone');
  const fi      = document.getElementById('fileInput');
  const sel     = document.getElementById('selected');
  const btn     = document.getElementById('uploadBtn');
  const lbl     = document.getElementById('uploadLabel');
  const help    = document.getElementById('help');
  const progBar = document.getElementById('progressBar');
  const progFill= document.getElementById('progressFill');
  let files = [];

  function fmt(b){
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
    return (b/1048576).toFixed(1) + ' MB';
  }

  function render(){
    sel.innerHTML = '';
    if (!files.length){
      sel.classList.remove('show');
      btn.disabled = true;
      lbl.textContent = 'Hochladen';
      help.innerHTML = 'Wähle Fotos, um den Upload zu starten.';
      return;
    }
    sel.classList.add('show');
    files.forEach((f, i) => {
      const row = document.createElement('div');
      row.className = 'thumb-row';
      const tt = document.createElement('div');
      tt.className = 'tt';
      // Show thumbnail preview
      const imgEl = document.createElement('img');
      imgEl.src = URL.createObjectURL(f);
      imgEl.alt = '';
      tt.appendChild(imgEl);

      row.innerHTML = `
        <div class="meta">
          <div class="name">${f.name}</div>
          <div class="size">${fmt(f.size)}</div>
        </div>
        <button class="rm" aria-label="Entfernen" data-i="${i}">✕</button>`;
      row.prepend(tt);
      sel.appendChild(row);
    });
    sel.querySelectorAll('.rm').forEach(b => b.addEventListener('click', e => {
      files.splice(+e.currentTarget.dataset.i, 1);
      render();
    }));
    btn.disabled = false;
    lbl.textContent = files.length === 1 ? '1 Foto hochladen 🚀' : files.length + ' Fotos hochladen 🚀';
    help.innerHTML = `Bereit. <b>Tippen, um zu posten</b>.`;
  }

  fi.addEventListener('change', e => {
    files = [...files, ...Array.from(e.target.files || [])].filter(f => f.type.startsWith('image/')).slice(0, 20);
    render();
  });

  ['dragenter','dragover'].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.add('drag'); }));
  ['dragleave','drop'].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.remove('drag'); }));
  dz.addEventListener('drop', e => {
    const dropped = Array.from(e.dataTransfer?.files || []).filter(f => f.type.startsWith('image/'));
    files = [...files, ...dropped].slice(0, 20);
    render();
  });

  btn.addEventListener('click', async () => {
    if (!files.length) return;
    btn.disabled = true;
    progBar.classList.add('show');
    progFill.style.width = '0%';

    let uploaded = 0;
    for (const file of files) {
      lbl.textContent = uploaded + ' / ' + files.length + ' hochgeladen…';
      help.innerHTML = 'Bitte warten…';
      const fd = new FormData();
      fd.append('foto', file);
      try {
        const res = await fetch('upload.php', { method: 'POST', body: fd });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || 'Fehler');
      } catch(e) {
        lbl.textContent = 'Fehler: ' + e.message;
        help.innerHTML = '<b>Upload fehlgeschlagen.</b> Bitte erneut versuchen.';
        btn.disabled = false;
        return;
      }
      uploaded++;
      progFill.style.width = (uploaded / files.length * 100) + '%';
    }

    lbl.textContent = '✓ ' + uploaded + (uploaded === 1 ? ' Foto' : ' Fotos') + ' hochgeladen';
    help.innerHTML = '<b>Erfolgreich!</b> Deine Fotos sind in der Galerie.';
    files = [];
    setTimeout(() => { location.href = 'gallery.html'; }, 1200);
  });
})();
</script>
</body>
</html>
